[package]
name = "facet"
version = "1.2.1"
license = "MIT"
description = "FACET — IDE, ami átalakul a fájl típusához"
authors = ["BBencht"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
