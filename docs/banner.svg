<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="FACET — Minden fájlnak saját arca">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F141D"/>
      <stop offset="1" stop-color="#090C11"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5C7A" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FF5C7A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1C2330"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D3E3"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#090C11" stop-opacity="0"/>
      <stop offset="1" stop-color="#090C11" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="460" rx="28"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      @keyframes drift1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,30px) } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-70px,-20px) } }
      @keyframes drift3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,-40px) } }
      .b1 { animation: drift1 14s ease-in-out infinite; }
      .b2 { animation: drift2 17s ease-in-out infinite; }
      .b3 { animation: drift3 12s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
      .gem { animation: float 6s ease-in-out infinite; transform-box: fill-box; }
      @keyframes cycle { 0%,16% { opacity: 1 } 20%,96% { opacity: 0 } 100% { opacity: 1 } }
      .s { opacity: 0; animation: cycle 15s infinite; }
      .s1 { animation-delay: 0s } .s2 { animation-delay: 3s } .s3 { animation-delay: 6s } .s4 { animation-delay: 9s } .s5 { animation-delay: 12s }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .caret { animation: blink 1.1s step-end infinite; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="460" fill="url(#bg)"/>
    <rect width="1280" height="460" fill="url(#dots)"/>
    <ellipse class="b1" cx="250" cy="200" rx="330" ry="260" fill="url(#g1)"/>
    <ellipse class="b2" cx="1080" cy="120" rx="360" ry="250" fill="url(#g2)"/>
    <ellipse class="b3" cx="760" cy="470" rx="380" ry="220" fill="url(#g3)"/>
    <rect width="1280" height="460" fill="url(#fade)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="459" rx="28" fill="none" stroke="#232B39"/>

  <!-- drágakő -->
  <g class="gem">
    <g transform="translate(118 86) scale(10.6)">
      <path d="M13 1 L24 8 L24 18 L13 25 L2 18 L2 8 Z" fill="#141A24" stroke="#2C3646" stroke-width="0.2"/>
      <path d="M13 1 L24 8 L13 13 Z" fill="#FF8A3D">
        <animate attributeName="fill" values="#FF8A3D;#F5C451;#FF8A3D" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M2 8 L13 1 L13 13 Z" fill="#FF5C7A">
        <animate attributeName="fill" values="#FF5C7A;#FF8A3D;#FF5C7A" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M2 8 L13 13 L13 25 L2 18 Z" fill="#4DA3FF">
        <animate attributeName="fill" values="#4DA3FF;#6FD3C1;#4DA3FF" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M13 13 L24 8 L24 18 L13 25 Z" fill="#232C3B"/>
      <path d="M13 1 L13 13 M2 8 L13 13 L24 8 M13 13 L13 25" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.15" fill="none"/>
    </g>
  </g>

  <g class="t">
    <text x="452" y="168" font-size="104" font-weight="800" letter-spacing="18" fill="url(#word)">FACET</text>
    <text x="456" y="224" font-size="30" font-weight="600" fill="#DCE3EE">Minden fájlnak saját arca.</text>
    <text x="456" y="262" font-size="18.5" fill="#8793A7">Fejlesztői környezet, ami átalakul ahhoz, amin épp dolgozol.</text>
  </g>

  <!-- fájltípus-váltó animáció -->
  <g class="m" font-size="17">
    <rect x="456" y="292" width="560" height="50" rx="12" fill="#0C1017" stroke="#252E3D"/>
    <text x="478" y="323" fill="#5C6A7E">$ open</text>

    <g class="s s1"><text x="552" y="323" fill="#FF8A3D">Main.java</text><text x="680" y="323" fill="#8A97AB">→ Java-eszközök, osztálytérkép</text></g>
    <g class="s s2"><text x="552" y="323" fill="#FF5C7A">index.html</text><text x="680" y="323" fill="#8A97AB">→ élő előnézet telefonon</text></g>
    <g class="s s3"><text x="552" y="323" fill="#4DA3FF">style.css</text><text x="680" y="323" fill="#8A97AB">→ színek, Flexbox-építő</text></g>
    <g class="s s4"><text x="552" y="323" fill="#F5C451">app.js</text><text x="680" y="323" fill="#8A97AB">→ Node, npm, tippek</text></g>
    <g class="s s5"><text x="552" y="323" fill="#E6D3B3">Beadandó.docx</text><text x="700" y="323" fill="#8A97AB">→ mini Word</text></g>
  </g>

  <!-- chipek -->
  <g class="t" font-size="14.5" font-weight="600">
    <g transform="translate(456 372)">
      <rect width="88" height="32" rx="16" fill="#FF8A3D" fill-opacity="0.12" stroke="#FF8A3D" stroke-opacity="0.45"/>
      <text x="44" y="21" text-anchor="middle" fill="#FF9C5C">Java</text>
    </g>
    <g transform="translate(554 372)">
      <rect width="88" height="32" rx="16" fill="#FF5C7A" fill-opacity="0.12" stroke="#FF5C7A" stroke-opacity="0.45"/>
      <text x="44" y="21" text-anchor="middle" fill="#FF7A92">HTML</text>
    </g>
    <g transform="translate(652 372)">
      <rect width="76" height="32" rx="16" fill="#4DA3FF" fill-opacity="0.12" stroke="#4DA3FF" stroke-opacity="0.45"/>
      <text x="38" y="21" text-anchor="middle" fill="#6DB4FF">CSS</text>
    </g>
    <g transform="translate(738 372)">
      <rect width="118" height="32" rx="16" fill="#F5C451" fill-opacity="0.12" stroke="#F5C451" stroke-opacity="0.45"/>
      <text x="59" y="21" text-anchor="middle" fill="#F5C451">JavaScript</text>
    </g>
    <g transform="translate(866 372)">
      <rect width="72" height="32" rx="16" fill="#6FD3C1" fill-opacity="0.12" stroke="#6FD3C1" stroke-opacity="0.45"/>
      <text x="36" y="21" text-anchor="middle" fill="#6FD3C1">Git</text>
    </g>
    <g transform="translate(948 372)">
      <rect width="68" height="32" rx="16" fill="#E6D3B3" fill-opacity="0.12" stroke="#E6D3B3" stroke-opacity="0.45"/>
      <text x="34" y="21" text-anchor="middle" fill="#E6D3B3">Word</text>
    </g>
  </g>

  <g class="t">
    <rect x="1140" y="34" width="104" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.05" stroke="#2A3343"/>
    <text x="1192" y="54" font-size="14" font-weight="700" fill="#AEB8C8" text-anchor="middle">v1.1.1</text>
    <text x="1244" y="430" font-size="13" fill="#4E596B" text-anchor="end">macOS · Windows 10/11 · Linux</text>
  </g>
</svg>
