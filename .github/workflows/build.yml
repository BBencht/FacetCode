name: FACET build

# Minden push után elkészülnek a telepítők (Actions → artifacts).
# Egy „v…” címke (pl. v1.1.0) feltöltésekor kiadás (Release) is készül a letölthető fájlokkal.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows 10/11
            platform: windows-latest
            args: ''
            rust_targets: ''
          - name: Linux
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux függőségek
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Ikonok
        run: npx tauri icon app-icon.png

      - name: Motor és felület előkészítése
        run: node scripts/prepare.mjs

      - name: Motor gyorsteszt
        shell: bash
        run: |
          (sleep 90 | java -jar src-tauri/res/engine/facet-engine.jar --app --port 0 --web src-tauri/res/web > engine.log 2>&1) &
          for i in $(seq 1 40); do grep -q FACET_PORT engine.log && break; sleep 0.5; done
          PORT=$(grep -o 'FACET_PORT=[0-9]*' engine.log | cut -d= -f2)
          echo "port=$PORT"
          curl -sf -H 'X-Facet: 1' "http://127.0.0.1:$PORT/api/ping"
          curl -sf -o /dev/null "http://127.0.0.1:$PORT/"
          curl -sf -o /dev/null "http://127.0.0.1:$PORT/vendor/monaco/vs/loader.js"

      - name: Build (címke nélkül)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Build és kiadás (címke)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FACET ${{ github.ref_name }}'
          releaseBody: 'Letöltés: macOS → .dmg, Windows → -setup.exe vagy .msi, Linux → .AppImage vagy .deb. Részletek a README-ben.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Telepítők feltöltése (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FACET-${{ runner.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
